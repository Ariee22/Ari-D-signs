<!DOCTYPE html>
<head>			
<title>Nail Booking System</title>
<style>
body { font- family : Arial;
       background-color : #fceef2;
	   margin:0;
	   padding: 20px; }
.container { background:white;
	         max-width:450px;
			 margin:auto;
			 padding:20px;
			border-radius: 15px; }
h1 { color: #b34d76;
     text-align:center;}
input, select, button { width: 100%;
                        padding: 12px;
						margin : 8px 0;
						box-sizing: border-box; }
button{ 
     background-color: #b34d76;
	 color : white;
	 border : none;
	 border-radius: 8px;
	 cursor: pointer; }
button:hover{ 
          background-color: #873653; }
.booking { background: #fceef2;
           padding:10px;
		   margin-top: 10px;
		   border-radius: 8px; }
</style>
</head>

<body>
<div class="container">
<h1> Tany Nails<h1>
<h3>Book an Appointment<h3>

<form id = "bookingForm">

<input type ="text" id = "name"
placeholder = "Customer name" required>
<input type ="tel" id = "phone"
placeholder = "Phone number" required>
<select id= "service" required>
  <option value = "">Choose nail service</option>
  <option>Gel Nails</option>
  <option>Acrylic Nails</option>
  <option>Manicure</option>
  <option>Pedicure</option>
  <option>Nail Art</option>
  <option>Stickon</option>
</select>
<input type=" date" id = "date" 
placeholder = "date" required>
<select id= "time" required>
<option value ="">Choose time</option>
<option>09:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>01:00 PM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>
<option>04:00 PM</option>
</select>

<button type = "submit"> Book Appointment</button>
</form>

<h3>Bookings</h3>

<div id = "bookings"></div>
</div>
<script>
let appointments = JSON.parse(localStorage.getItem("appointments")||"[]");
function displayBookings(){ let output= document.getElementByld ("bookings");
output.innerHTML="";
appointments.forEach(function(booking,index){
output.innerrHTML +='
<div class="bookings">
<b>${booking.name}</b<<br>
Phone:${booking.phone}<br>
Service:{booking.service}<br>
Date:${booking.date}<br>
Time:${booking.time}<br>

<button onclick = "deleteBooking(${index})">
Cancel Booking
</button>
</div>
';
});
}
document.getElementByld("bookingForm")
.addEventlistener("submit",function (event){
event.preventDefault();
let booking = { name:document.getElementByld ("name").value,
                phone: document.getElementByld("phone").value,
				service: document.getElementByld("service").value,
				date: document.getElementByld("date").value,
				time: document.getElementByld("time").value	};
let message =
"NEW NAIL APPOINTMENT%0A+
"Name:"+ encodeURIComponent(name) +"%OA" +
"Phone:"+ encodeURIComponent(phone) + "%OA" +
"Service: "+encodeURIComponent(service) + "%OA" +
"Date: " +encodeURIComponent(date) + "OA" +
"Time:" + encodeURIComponent(time) +"OA" +
let salonNumber = " +263788308541";

let link = "https://wa.me/" + salonNumber +
"?text=" + message;
window.open(link,"_blank");

appointments.push(booking);

localStorage.setItem( "appointments" ,
JSON.stringfy(appointments)
);

alert("Appointment booked successfully!");

this.reset();

displayBooking();
});

function deleteBooking(index){ appointments.splice(index, 1);

localStorage.setItem( "appointments", JSON.stringify(appointments)
);

displayBookings();
}
displayBookings();
</script>

</body>
</html>
